<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acme Billing</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 560px; margin: 48px auto; padding: 0 16px; color: #1b1b1f; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 8px 20px; }
  dt { color: #6b6b76; }
  dd { margin: 0; font-weight: 600; }
</style>
</head>
<body>
<h1>Your account</h1>
<dl>
  <dt>Today</dt><dd id="today"></dd>
  <dt>Trial ends</dt><dd id="trial-end"></dd>
  <dt>Next invoice</dt><dd id="next-invoice"></dd>
</dl>
<script>
  const now = new Date();
  const fmt = d => d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
  const pad = n => String(n).padStart(2, '0');
  // Local calendar date, not the UTC one from toISOString().
  const isoDay = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
  document.getElementById('today').textContent = isoDay;
  const trialEnd = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 14);
  document.getElementById('trial-end').textContent = fmt(trialEnd);
  // One calendar month later, clamped to the last day of the target month.
  const y = now.getFullYear(), m = now.getMonth() + 1;
  const lastDay = new Date(y, m + 1, 0).getDate();
  const invoice = new Date(y, m, Math.min(now.getDate(), lastDay));
  document.getElementById('next-invoice').textContent = fmt(invoice);
</script>
</body>
</html>
